name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CloudiagnozeApp/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (permissive)
        continue-on-error: true
        run: ruff check CloudiagnozeApp

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      DB_HOST: localhost
      DB_PORT: "3306"
      DB_NAME: clouddiagnoze_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: eu-west-3
      ENVIRONMENT: development
      CORS_ORIGINS: "http://localhost"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CloudiagnozeApp/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libmariadb-dev pkg-config

      - name: Install Python dependencies
        working-directory: CloudiagnozeApp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: CloudiagnozeApp
        run: pytest -v --tb=short

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create dummy .env for build
        run: |
          cat > .env <<'EOF'
          DB_ROOT_PASSWORD=ci_root_password
          DB_NAME=clouddiagnoze
          DB_USER=clouddiagnoze_user
          DB_PASSWORD=ci_user_password
          SECRET_KEY=ci-build-secret-key
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=10080
          AWS_ACCESS_KEY_ID=ci-access-key
          AWS_SECRET_ACCESS_KEY=ci-secret-key
          AWS_DEFAULT_REGION=eu-west-1
          ENVIRONMENT=production
          EOF

      - name: Build Docker images
        run: docker compose build

