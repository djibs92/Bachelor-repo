<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750">
  <defs>
    <linearGradient id="layer7Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer6Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer5Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F87171;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="750" fill="#0F172A"/>
  
  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC">🛡️ Architecture Sécurité CloudDiagnoze</text>
  <text x="450" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Défense en profondeur - Modèle OSI</text>

  <!-- COUCHE 7 - APPLICATION -->
  <g filter="url(#shadow)">
    <rect x="50" y="95" width="800" height="95" rx="12" fill="url(#layer7Grad)"/>
    <text x="75" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">COUCHE 7 - APPLICATION</text>
    <text x="760" y="125" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">HTTP / API</text>
    
    <!-- Elements -->
    <rect x="75" y="140" width="170" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="160" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">⚡ Rate Limiting</text>
    
    <rect x="260" y="140" width="170" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="345" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🌐 CORS Policy</text>
    
    <rect x="445" y="140" width="170" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="530" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">✅ Validation Pydantic</text>
    
    <rect x="630" y="140" width="195" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="727" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🛡️ Security Headers</text>
  </g>

  <!-- COUCHE 6 - PRESENTATION -->
  <g filter="url(#shadow)">
    <rect x="50" y="200" width="800" height="95" rx="12" fill="url(#layer6Grad)"/>
    <text x="75" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">COUCHE 6 - PRÉSENTATION</text>
    <text x="760" y="230" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">SSL / TLS</text>
    
    <rect x="75" y="245" width="230" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="190" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">📦 Compression GZIP</text>
    
    <rect x="320" y="245" width="230" height="38" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="435" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">🔐 HTTPS/TLS (prod)</text>
    
    <rect x="565" y="245" width="260" height="38" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="695" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">🔒 Certificats SSL (prod)</text>
  </g>

  <!-- COUCHE 5 - SESSION -->
  <g filter="url(#shadow)">
    <rect x="50" y="305" width="800" height="95" rx="12" fill="url(#layer5Grad)"/>
    <text x="75" y="335" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">COUCHE 5 - SESSION</text>
    <text x="760" y="335" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">Tokens</text>
    
    <rect x="75" y="350" width="230" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="190" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🎟️ JWT Tokens (HS256)</text>
    
    <rect x="320" y="350" width="230" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="435" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">⏱️ Expiration 7 jours</text>
    
    <rect x="565" y="350" width="260" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="695" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🔑 Reset Token Sécurisé</text>
  </g>

  <!-- COUCHE 4 - TRANSPORT -->
  <g filter="url(#shadow)">
    <rect x="50" y="410" width="800" height="95" rx="12" fill="url(#layer4Grad)"/>
    <text x="75" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">COUCHE 4 - TRANSPORT</text>
    <text x="760" y="440" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">TCP/UDP</text>
    
    <rect x="75" y="455" width="350" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="250" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🔌 Connexions TCP fiables</text>
    
    <rect x="440" y="455" width="385" height="38" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="632" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">🔐 TLS 1.2/1.3 Encryption (prod)</text>
  </g>

  <!-- COUCHE 3 - RESEAU -->
  <g filter="url(#shadow)">
    <rect x="50" y="515" width="800" height="95" rx="12" fill="url(#layer3Grad)"/>
    <text x="75" y="545" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">COUCHE 3 - RÉSEAU</text>
    <text x="760" y="545" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">IP / Docker</text>
    
    <rect x="75" y="560" width="350" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="250" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">🐳 Isolation Docker Network</text>
    
    <rect x="440" y="560" width="385" height="38" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="632" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">📡 Proxy Headers (X-Real-IP, X-Forwarded-For)</text>
  </g>

  <!-- COUCHE DONNEES (Transversal) -->
  <g filter="url(#shadow)">
    <rect x="50" y="620" width="800" height="110" rx="12" fill="url(#dataGrad)"/>
    <text x="75" y="650" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">🔐 SÉCURITÉ DES DONNÉES (Transversal)</text>
    
    <rect x="75" y="665" width="230" height="50" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="190" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">🔒 Bcrypt Hashing</text>
    <text x="190" y="703" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Salt automatique</text>
    
    <rect x="320" y="665" width="230" height="50" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="435" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">✅ Validation Password</text>
    <text x="435" y="703" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">8 chars, maj, min, chiffre</text>
    
    <rect x="565" y="665" width="260" height="50" rx="6" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1"/>
    <text x="695" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">🔑 Variables Environnement</text>
    <text x="695" y="703" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Secrets via .env</text>
  </g>

  <!-- Legende -->
  <rect x="650" y="50" width="180" height="35" rx="6" fill="rgba(255,255,255,0.1)"/>
  <rect x="660" y="60" width="15" height="15" rx="2" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1"/>
  <text x="680" y="72" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">Implémenté</text>
  <rect x="745" y="60" width="15" height="15" rx="2" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="765" y="72" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8">À faire (prod)</text>
</svg>

