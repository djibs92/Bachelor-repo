<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
    <linearGradient id="nginxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="fastapiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="mariaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="networkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">🚀 Diagramme de Déploiement - CloudDiagnoze</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Architecture Docker Compose - 3 Conteneurs</text>

  <!-- User -->
  <g transform="translate(100, 520)">
    <circle cx="0" cy="-30" r="20" fill="#3b82f6" filter="url(#shadow)"/>
    <text x="0" y="-25" text-anchor="middle" font-size="20">👤</text>
    <rect x="-30" y="0" width="60" height="40" rx="5" fill="#3b82f6" filter="url(#shadow)"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial" font-size="11" fill="white" font-weight="bold">Navigateur</text>
    <text x="0" y="60" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">localhost:80</text>
  </g>

  <!-- Arrow from User to Host -->
  <path d="M 160 520 L 220 520 L 220 400" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <text x="195" y="450" font-family="Arial" font-size="10" fill="#3b82f6" font-weight="bold">HTTP</text>

  <!-- Host Machine -->
  <rect x="200" y="70" width="650" height="380" rx="15" fill="url(#hostGrad)" filter="url(#shadow)"/>
  <text x="525" y="100" text-anchor="middle" font-family="Arial" font-size="16" fill="white" font-weight="bold">🖥️ MACHINE HÔTE</text>

  <!-- Docker Engine -->
  <rect x="230" y="120" width="590" height="310" rx="10" fill="url(#dockerGrad)" opacity="0.15" stroke="#0ea5e9" stroke-width="2"/>
  <text x="525" y="145" text-anchor="middle" font-family="Arial" font-size="14" fill="#0ea5e9" font-weight="bold">🐳 DOCKER ENGINE</text>

  <!-- Container 1: Nginx -->
  <rect x="260" y="170" width="160" height="180" rx="10" fill="url(#nginxGrad)" filter="url(#shadow)"/>
  <text x="340" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">📦 NGINX</text>
  <text x="340" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.8)">Frontend</text>
  <rect x="280" y="235" width="120" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="340" y="252" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Port: 80</text>
  <rect x="280" y="270" width="120" height="60" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="340" y="290" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Fichiers HTML</text>
  <text x="340" y="305" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• JavaScript</text>
  <text x="340" y="320" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• CSS</text>

  <!-- Container 2: FastAPI -->
  <rect x="450" y="170" width="160" height="180" rx="10" fill="url(#fastapiGrad)" filter="url(#shadow)"/>
  <text x="530" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">📦 FASTAPI</text>
  <text x="530" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.8)">Backend</text>
  <rect x="470" y="235" width="120" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="530" y="252" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Port: 8000</text>
  <rect x="470" y="270" width="120" height="60" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="530" y="290" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• API REST</text>
  <text x="530" y="305" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Auth JWT</text>
  <text x="530" y="320" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Scanners AWS</text>

  <!-- Container 3: MariaDB -->
  <rect x="640" y="170" width="160" height="180" rx="10" fill="url(#mariaGrad)" filter="url(#shadow)"/>
  <text x="720" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">📦 MARIADB</text>
  <text x="720" y="220" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.8)">Database</text>
  <rect x="660" y="235" width="120" height="25" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="720" y="252" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Port: 3306</text>
  <rect x="660" y="270" width="120" height="60" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="720" y="290" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• 11 Tables</text>
  <text x="720" y="305" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Volume persistant</text>
  <text x="720" y="320" text-anchor="middle" font-family="Arial" font-size="9" fill="white">• Données isolées</text>

  <!-- Arrows between containers -->
  <path d="M 420 260 L 450 260" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"/>
  <path d="M 610 260 L 640 260" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowWhite)"/>
  <defs>
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="white"/>
    </marker>
  </defs>

  <!-- Network bar -->
  <rect x="260" y="370" width="540" height="40" rx="8" fill="url(#networkGrad)" filter="url(#shadow)"/>
  <text x="530" y="395" text-anchor="middle" font-family="Arial" font-size="12" fill="white" font-weight="bold">🌐 clouddiagnoze_network (réseau Docker isolé)</text>

  <!-- Connection lines to network -->
  <line x1="340" y1="350" x2="340" y2="370" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4"/>
  <line x1="530" y1="350" x2="530" y2="370" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4"/>
  <line x1="720" y1="350" x2="720" y2="370" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4"/>

  <!-- Port 80 exposed indicator -->
  <rect x="220" y="385" width="80" height="25" rx="5" fill="#ef4444"/>
  <text x="260" y="402" text-anchor="middle" font-family="Arial" font-size="10" fill="white" font-weight="bold">🔓 Port 80</text>
  <text x="260" y="425" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">Seul port exposé</text>

  <!-- Legend -->
  <rect x="580" y="480" width="280" height="140" rx="10" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="505" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1e293b">📋 Légende</text>
  
  <rect x="600" y="520" width="15" height="15" rx="3" fill="#22c55e"/>
  <text x="625" y="532" font-family="Arial" font-size="10" fill="#374151">Nginx - Serveur web statique</text>
  
  <rect x="600" y="545" width="15" height="15" rx="3" fill="#06b6d4"/>
  <text x="625" y="557" font-family="Arial" font-size="10" fill="#374151">FastAPI - API Python async</text>
  
  <rect x="600" y="570" width="15" height="15" rx="3" fill="#f97316"/>
  <text x="625" y="582" font-family="Arial" font-size="10" fill="#374151">MariaDB - Base de données</text>
  
  <rect x="600" y="595" width="15" height="15" rx="3" fill="#8b5cf6"/>
  <text x="625" y="607" font-family="Arial" font-size="10" fill="#374151">Réseau interne Docker</text>

  <!-- Command box -->
  <rect x="200" y="480" width="350" height="80" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <text x="220" y="505" font-family="Arial" font-size="11" fill="#22c55e" font-weight="bold">$ Commande de lancement :</text>
  <text x="220" y="530" font-family="monospace" font-size="14" fill="#fbbf24">docker compose up -d</text>
  <text x="220" y="550" font-family="Arial" font-size="9" fill="#94a3b8">Lance les 3 conteneurs en arrière-plan</text>

</svg>
